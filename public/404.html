<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F4EFE4">
    <title>Sayfa bulunamadı — NotaNota</title>
    <style>
      :root { color: #20231f; background: #f4efe4; font-family: Arial, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, #fffdf8, transparent 42%), #f4efe4; }
      main { width: min(560px, calc(100% - 40px)); padding: 44px; border: 1px solid #d5caba; background: #fbf8f1; box-shadow: 10px 12px 0 rgba(54,43,30,.06); }
      span { width: 42px; height: 42px; padding: 6px; display: grid; place-items: center; border: 1px solid #c6a15b; border-radius: 50%; background: #fffdf8; }
      span img { width: 100%; height: 100%; display: block; object-fit: contain; }
      p { color: #64665f; line-height: 1.6; }
      h1 { margin: 22px 0 12px; font-family: Georgia, serif; font-size: clamp(38px, 8vw, 62px); font-weight: 500; letter-spacing: -.04em; }
      a { min-height: 48px; margin-top: 14px; padding: 0 20px; display: inline-flex; align-items: center; background: #8b2f3c; color: #fffdf8; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true"><img src="https://notanota.online/notanota-monogram.png" alt=""></span>
      <h1>Bu sayfa burada değil.</h1>
      <p>Aradığın bağlantı taşınmış veya artık bulunmuyor olabilir. NotaNota stüdyosuna dönüp çalışmaya devam edebilirsin.</p>
